[package]
name = "snep-certifications-api"
version = "0.1.0"
edition = "2021"
description = "Rust API for SNEP music certifications with Axum and SQLx"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "cookies", "stream", "rustls-tls"] }
scraper = "0.20"
select = "0.7"
url = "2.5"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }
schemars = "0.8"
utoipa = { version = "4.3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
axum-extra = { version = "0.9", features = ["json"] }
validator = { version = "0.16", features = ["derive"] }
lazy_static = "1.4"
regex = "1.10"
once_cell = "1.19"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "testing"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "cookies", "stream", "rustls-tls"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "test-util"] }
axum = { version = "0.7", features = ["json", "multipart"] }
tower = { version = "0.4", features = ["util"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
api = []

[[bin]]
name = "snep-api"
path = "src/main.rs"

[[bin]]
name = "snep-scraper"
path = "src/scraper_main.rs"

[[bin]]
name = "snep-migrate"
path = "src/migrate_main.rs"