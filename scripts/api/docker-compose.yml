version: '3.8'

services:
  # PostgreSQL database (use Supabase in production)
  postgres:
    image: postgres:16-alpine
    container_name: snep-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: snep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: snep-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snep
      DB_MAX_CONNECTIONS: 10
      HOST: 0.0.0.0
      PORT: 3000
      RUST_LOG: info,snep_certifications_api=debug,tower_http=info,sqlx=warn
      ENABLE_CORS: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scraper service (run periodically via cron or manually)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: snep-scraper
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snep
      DB_MAX_CONNECTIONS: 5
      RUST_LOG: info,snep_scraper=debug,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
    command: ["snep-scraper", "--max-pages", "0"]
    # Run once daily via cron in production
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  # Migration runner
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: snep-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snep
      DB_MAX_CONNECTIONS: 5
    depends_on:
      postgres:
        condition: service_healthy
    command: ["snep-migrate"]
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: snep-network